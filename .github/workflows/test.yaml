name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      # The documentation is ant's docs/ as of the ant release the installed @ant-lang/wasm pins in
      # its "ant" field, so the docs describe the interpreter the playground runs.
      # .vitepress/docs.ts copies it in.
      - name: ant ref
        id: ant
        run: |
          ref=$(jq -r .ant node_modules/@ant-lang/wasm/package.json)
          case $ref in
            v[0-9]*.[0-9]*.[0-9]*) echo "ref=$ref" >> "$GITHUB_OUTPUT" ;;
            *) echo "@ant-lang/wasm pins ant $ref, not a release tag" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ant-src/ant
          ref: ${{ steps.ant.outputs.ref }}
          path: .ant
          sparse-checkout: docs
          persist-credentials: false
      - run: npm run build
        env:
          ANT_DOCS: .ant/docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .vitepress/dist

  # install.ps1 under PowerShell 7 and Windows PowerShell 5.1, read the way `irm | iex` runs it.
  install:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [pwsh, powershell]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: latest
        run: |
          Get-Content -Raw public/install.ps1 | Invoke-Expression
          ant version
      - name: pinned version, PATH entry added once
        env:
          ANT_VERSION: v0.1.0
        run: |
          Get-Content -Raw public/install.ps1 | Invoke-Expression
          $out = ant version
          if ($out -ne 'ant v0.1.0') { throw "ant version printed: $out" }
          $dir = Join-Path $HOME 'bin'
          $entries = (Get-ItemProperty HKCU:\Environment).Path -split ';' | Where-Object { $_ -eq $dir }
          if (@($entries).Count -ne 1) { throw "$dir is in the user PATH $(@($entries).Count) times" }
